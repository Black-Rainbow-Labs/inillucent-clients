[package]
name = "inillucent-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Client for the Inillucent embedded database, loading its C ABI at runtime."
repository = "https://github.com/Black-Rainbow-Labs/inillucent-clients"
keywords = ["database", "embedded", "sql", "inillucent"]
categories = ["database"]

[lib]
name = "inillucent"
path = "src/lib.rs"

[dependencies]
libloading = "0.8"

[dev-dependencies]
serde_json = "1"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "person"
path = "examples/person.rs"
